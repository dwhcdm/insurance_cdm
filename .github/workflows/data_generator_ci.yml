# ============================================================================
# Data Generator CI Pipeline
# Validates Python code quality and runs unit tests.
# ============================================================================

name: Data Generator CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'sanctions_data_generator/**'
      - '.github/workflows/data_generator_ci.yml'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r sanctions_data_generator/requirements.txt

      - name: Lint with ruff
        run: |
          ruff check sanctions_data_generator/ --output-format github

      - name: Format check with black
        run: |
          black --check sanctions_data_generator/

      - name: Type check with mypy
        run: |
          mypy sanctions_data_generator/ --ignore-missing-imports

      - name: Run unit tests
        run: |
          cd sanctions_data_generator && pytest tests/ -v --cov=generators --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: sanctions_data_generator/coverage.xml
