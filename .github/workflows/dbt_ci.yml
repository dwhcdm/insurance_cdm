# ============================================================================
# DBT CI Pipeline
# Runs on pull requests to validate dbt models, tests, and documentation.
# ============================================================================

name: DBT CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'sanctions_dbt/**'
      - '.github/workflows/dbt_ci.yml'

env:
  DBT_PROFILES_DIR: ./sanctions_dbt
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}

jobs:
  dbt-lint:
    name: SQL Lint (SQLFluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install sqlfluff sqlfluff-templater-dbt dbt-snowflake

      - name: Run SQLFluff lint
        working-directory: sanctions_dbt
        run: |
          sqlfluff lint models/ --dialect snowflake --format github-annotation

  dbt-build:
    name: DBT Build & Test
    runs-on: ubuntu-latest
    needs: dbt-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install dbt-snowflake

      - name: Install dbt packages
        working-directory: sanctions_dbt
        run: dbt deps

      - name: Validate dbt project
        working-directory: sanctions_dbt
        run: dbt parse

      - name: Run dbt build (compile + run + test)
        working-directory: sanctions_dbt
        run: |
          dbt build --target test --select state:modified+ --defer --state ./target

      - name: Generate docs
        working-directory: sanctions_dbt
        run: dbt docs generate

      - name: Upload dbt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            sanctions_dbt/target/manifest.json
            sanctions_dbt/target/run_results.json
            sanctions_dbt/target/catalog.json

  dbt-docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: dbt-build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install dbt-snowflake

      - name: Install packages & generate docs
        working-directory: sanctions_dbt
        run: |
          dbt deps
          dbt docs generate

      - name: Upload docs site
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: sanctions_dbt/target/
