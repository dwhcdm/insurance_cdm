name: 'sanctions_platform'
version: '1.0.0'
config-version: 2

profile: 'sanctions_platform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

require-dbt-version: [">=1.7.0", "<2.0.0"]

vars:
  start_date: '2015-01-01'
  end_date: '2035-12-31'
  sanctions_match_threshold: 0.85

models:
  sanctions_platform:
    +materialized: view
    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging', 'daily']

    intermediate:
      +materialized: ephemeral
      +tags: ['intermediate']

    marts:
      core:
        +materialized: table
        +schema: analytics
        +tags: ['mart', 'core']
        +post-hook:
          - "{{ grant_select_on_schemas(schemas=['analytics'], role='SANCTIONS_ANALYST') }}"

      derived:
        +materialized: incremental
        +schema: derived
        +tags: ['mart', 'derived', 'daily']
        +post-hook:
          - "{{ grant_select_on_schemas(schemas=['derived'], role='SANCTIONS_ANALYST') }}"

seeds:
  sanctions_platform:
    +schema: staging
    seed_country_codes:
      +column_types:
        country_code: varchar(3)
        country_name: varchar(100)
        region: varchar(50)
        sub_region: varchar(50)
        is_high_risk: boolean
        is_sanctioned_jurisdiction: boolean
    seed_commodity_codes:
      +column_types:
        commodity_code: varchar(20)
        commodity_name: varchar(100)
        commodity_group: varchar(50)
        hs_code: varchar(10)
        unit_of_measure: varchar(10)

snapshots:
  sanctions_platform:
    +target_schema: curated
    +tags: ['snapshot', 'daily']
